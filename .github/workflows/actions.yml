name: Push actions

on:
  pull_request:
  push:
  schedule:
    # Weekly, to catch breakage from new Home Assistant releases.
    - cron:  '0 0 * * 1'
  workflow_dispatch:

jobs:
  validate:
    runs-on: "ubuntu-latest"
    name: Validate
    steps:
        - uses: "actions/checkout@v4"

        - name: HACS validation
          uses: "hacs/action@main"
          with:
            category: "integration"

        - name: Hassfest validation
          uses: "home-assistant/actions/hassfest@master"

  style:
    runs-on: "ubuntu-latest"
    name: Check style formatting
    steps:
        - uses: "actions/checkout@v4"
        - uses: actions/setup-python@v7
          with:
            python-version: 3.9
        - run: python3 -m pip install black
        - run: black .

  tests:
    runs-on: "ubuntu-latest"
    name: Run tests
    strategy:
      fail-fast: false
      matrix:
        # Home Assistant 2024.2 is the oldest supported release; see hacs.json.
        include:
          # The oldest supported release, on both Python versions it accepts.
          - python-version: "3.11"
            # Home Assistant 2024.2.0, the oldest release this integration supports
            pytest-homeassistant-custom-component-version: 0.13.99
          - python-version: "3.12"
            # Home Assistant 2024.2.0
            pytest-homeassistant-custom-component-version: 0.13.99
          - python-version: "3.12"
            # Home Assistant 2024.6. 0.13.128+ avoids mypy-dev, but has a
            # josepy/acme incompatibility, so josepy<2 is forced below.
            pytest-homeassistant-custom-component-version: 0.13.128
          - python-version: "3.12"
            # Home Assistant 2024.8.0
            pytest-homeassistant-custom-component-version: 0.13.152
          - python-version: "3.12"
            # Home Assistant 2024.9.1
            pytest-homeassistant-custom-component-version: 0.13.162
          - python-version: "3.12"
            # Home Assistant 2025.1.4, the last release that still runs on 3.12
            pytest-homeassistant-custom-component-version: 0.13.205
          - python-version: "3.13"
            # Home Assistant 2025.8.3
            pytest-homeassistant-custom-component-version: 0.13.272
          - python-version: "3.13"
            # Home Assistant 2026.1.3
            pytest-homeassistant-custom-component-version: 0.13.308
          - python-version: "3.14"
            # Home Assistant 2026.6.4
            pytest-homeassistant-custom-component-version: 0.13.340
          - python-version: "3.14"
            # Home Assistant 2026.7.4
            pytest-homeassistant-custom-component-version: 0.13.348
          - python-version: "3.14"
            # Home Assistant 2026.8.2
            pytest-homeassistant-custom-component-version: 0.13.356
    steps:
      - name: Check out code from GitHub
        uses: "actions/checkout@v4"
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install requirements
        run: |
          sed -i 's/pytest-homeassistant-custom-component==[0-9]*\.[0-9]*\.[0-9]*/pytest-homeassistant-custom-component==${{ matrix.pytest-homeassistant-custom-component-version }}/g' requirements_test.txt
          python3 -m pip install -r requirements_test.txt
          # Pin josepy<2 only for Python 3.12 + pytest-homeassistant-custom-component>=0.13.128
          # (acme uses ComparableX509, removed in josepy 2.0)
          if [[ "${{ matrix.python-version }}" == "3.12" ]] && [[ "$(printf '%s\n' "0.13.128" "${{ matrix.pytest-homeassistant-custom-component-version }}" | sort -V | tail -1)" == "${{ matrix.pytest-homeassistant-custom-component-version }}" ]]; then
            python3 -m pip install 'josepy<2'
          fi
          # aiodns < 3.6 declares `pycares>=4.9.0` with no upper bound, but
          # pycares 5 removed symbols aiodns uses at import time. Only the
          # matrix entries pinning such an aiodns need the older pycares.
          if python3 -c "import sys; from importlib.metadata import version; from packaging.version import Version; sys.exit(0 if Version(version('aiodns')) < Version('3.6') else 1)"; then
            python3 -m pip install 'pycares<5'
          fi
      - name: Run tests
        run: |
          pytest \
            -qq \
            --timeout=35 \
            --durations=10 \
            -n auto \
            --cov custom_components.vaillant_plus \
            -o console_output_style=count \
            -p no:sugar \
            tests
          coverage lcov
      - name: Upload Coverage Results
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          path-to-lcov: coverage.lcov
          parallel: true
          flag-name: run-${{ join(matrix.*, ' - ') }}
  finish:
    needs: tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Close parallel build
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          #carryforward: "run-3.9,run-3.10,run-3.11"
